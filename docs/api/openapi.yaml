    name: 'Productos Unificados'
    description: ''
  -
    name: 'Importación de Productos'
    description: "\nImportación masiva de productos."
  -
    name: Nutrición
    description: "\nEstadísticas y datos nutricionales."
  -
    name: Depósitos
