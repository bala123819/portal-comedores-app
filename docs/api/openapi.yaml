    name: 'Requerimientos de Documentos'
    description: "\nGestión de requerimientos base de documentos (globales y por tipo de organización)."
  -
    name: 'Sucursales de Donantes - Contactos'
    description: "\nCRUD de contactos múltiples por sucursal de donante, con roles diferenciados."
  -
    name: 'Tareas Asíncronas'
    description: ''
  -
    name: 'Tenant - Configuration'
    description: ''
  -
    name: Trazabilidad
    description: ''
  -
    name: Voluntarios
    description: ''
  -
    name: Webhooks
    description: ''
  -
    name: 'Zonas comerciales de donantes'
    description: "\nAdministración de las zonas con las que una cadena agrupa sus sucursales. El\nalcance del gerente de zona (`donor_scope = 'zonas'`) se resuelve contra esto,\nasí que sin CRUD habría que zonificar por SQL.\n\n⚠️ **No son `GeographicZone`.** Esas son del banco y definen qué organización\npuede retirar de dónde. Estas son la geografía comercial de una cadena.\n\nTodo el grupo pasa por `requiere_esquema_zonas`, que devuelve 503 mientras la\nmigration de zonas no esté aplicada en la base."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtén tu token via `POST /api/auth/login`. Envíalo como `Authorization: Bearer {token}`. Para integraciones M2M, usa el header `X-API-Key`.'
security:
  -
    default: []
paths:
  /api/auth/login:
    post:
      summary: 'Iniciar sesión'
      operationId: iniciarSesin
      description: 'Autentica al usuario con email y contraseña, retorna token de acceso.'
      parameters: []
      responses: {  }
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email del usuario.'
                  example: admin@banco.org
                password:
                  type: string
                  description: Contraseña.
                  example: secret123
              required:
                - email
                - password
      security: []
  /api/auth/logout:
    post:
      summary: 'Cerrar sesión'
      operationId: cerrarSesin
      description: 'Revoca el token de acceso actual.'
      parameters: []
      responses: {  }
      tags:
        - Autenticación
  /api/auth/me:
    get:
      summary: 'Obtener usuario autenticado'
      operationId: obtenerUsuarioAutenticado
      description: 'Retorna los datos del usuario actual con roles, permisos y tenant.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'No autenticado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No autenticado'
      tags:
        - Autenticación
  /api/auth/profile:
    put:
      summary: 'Actualizar perfil'
      operationId: actualizarPerfil
      description: 'Actualiza los datos del perfil del usuario autenticado.'
      parameters: []
      responses: {  }
      tags:
        - Autenticación
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: 'Must be at least 2 characters. Must not be greater than 100 characters.'
                  example: b
                last_name:
                  type: string
                  description: 'Must be at least 2 characters. Must not be greater than 100 characters.'
                  example: 'n'
                phone:
                  type: string
                  description: 'Must match the regex /^[\d\s\+\-\(\)]{6,20}$/. Must not be greater than 20 characters.'
                  example: gzmiyvdljnikhway
                  nullable: true
                avatar_url:
                  type: string
                  description: 'Must be a valid URL. Must not be greater than 500 characters.'
                  example: 'http://www.romaguera.net/aut-adipisci-quidem-nostrum-qui-commodi-incidunt-iure'
                  nullable: true
                preferences:
                  type: object
                  description: ''
                  example: null
                  properties: {  }
  /api/auth/password:
    put:
      summary: 'Cambiar contraseña'
      operationId: cambiarContrasea
      description: 'Cambia la contraseña del usuario autenticado.'
      parameters: []
      responses: {  }
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: ''
                  example: architecto
                new_password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: ngzmiyvdljnikhwaykcmyuwpwl
              required:
                - current_password
                - new_password
  /api/auth/refresh:
    post:
      summary: 'Renovar token'
      operationId: renovarToken
      description: 'Elimina el token actual y genera uno nuevo.'
      parameters: []
      responses: {  }
      tags:
        - Autenticación
  /api/users:
    get:
      summary: 'Listar usuarios'
      operationId: listarUsuarios
      description: 'Retorna lista paginada de usuarios del tenant.'
      parameters:
        -
          in: query
          name: search
          description: 'Buscar por nombre o email.'
          example: Juan
          required: false
          schema:
            type: string
            description: 'Buscar por nombre o email.'
            example: Juan
        -
          in: query
          name: role
          description: 'Filtrar por nombre de rol.'
          example: admin
          required: false
          schema:
            type: string
            description: 'Filtrar por nombre de rol.'
            example: admin
        -
          in: query
          name: is_active
          description: 'Filtrar por estado activo/inactivo.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Filtrar por estado activo/inactivo.'
            example: true
        -
          in: query
          name: per_page
          description: 'Resultados por página.'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Resultados por página.'
            example: 25
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'No autenticado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No autenticado'
      tags:
        - Usuarios
    post:
      summary: 'Crear usuario'
      operationId: crearUsuario
      description: 'Crea un nuevo usuario en el tenant actual.'
      parameters: []
      responses: {  }
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email (único).'
                  example: nuevo@banco.org
                password:
                  type: string
                  description: Contraseña.
                  example: secret123
                first_name:
                  type: string
                  description: Nombre.
                  example: Ana
                last_name:
                  type: string
                  description: Apellido.
                  example: García
                phone:
                  type: string
                  description: Teléfono.
                  example: null
                  nullable: true
                avatar_url:
                  type: string
                  description: 'Must be a valid URL. Must not be greater than 500 characters.'
                  example: 'http://leffler.com/'
                  nullable: true
                is_active:
                  type: boolean
                  description: Activo.
                  example: true
                roles:
                  type: array
                  description: 'Must be a valid UUID. The <code>id</code> of an existing record in the roles table.'
                  example:
                    - c71cb930-01f3-381c-9172-e1c70e63388f
                  items:
                    type: string
                donor_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 502eabbf-311f-3542-a47b-b2a14f5de904
                  nullable: true
                donor_scope:
                  type: string
                  description: ''
                  example: todas
                  enum:
                    - todas
                    - zonas
                    - sucursales
                  nullable: true
                donor_branch_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: c70690f4-50e8-3200-abfa-73718cbd9b2a
                  nullable: true
                organization_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: f2726f3d-9044-3663-bede-2a0f37053879
                  nullable: true
                branch_ids:
                  type: array
                  description: 'Must be a valid UUID.'
                  example:
                    - e660ec64-aeea-3ded-bfe4-fb1f468259dc
                  items:
                    type: string
                zone_ids:
                  type: array
                  description: 'Must be a valid UUID.'
                  example:
                    - 9e13baad-9e20-392f-94ab-6047f7ff6a83
                  items:
                    type: string
                role:
                  type: string
                  description: 'Rol Spatie a asignar.'
                  example: Operador
              required:
                - email
                - password
                - first_name
                - last_name
  '/api/users/{user_id}':
    get:
      summary: 'Ver usuario'
      operationId: verUsuario
      description: 'Retorna los datos de un usuario específico con sus roles y permisos.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'No autenticado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No autenticado'
      tags:
        - Usuarios
    put:
      summary: 'Actualizar usuario'
      operationId: actualizarUsuario
      description: 'Actualiza los datos y roles de un usuario.'
      parameters: []
      responses: {  }
      tags:
        - Usuarios
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '+-0pBNvYgxwmi/#iw'
                first_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: u
                last_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: w
                phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: pwlvqwrsitcpscql
                  nullable: true
                avatar_url:
                  type: string
                  description: 'Must be a valid URL. Must not be greater than 500 characters.'
                  example: 'http://leffler.com/'
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: false
                is_verified:
                  type: boolean
                  description: ''
                  example: false
                roles:
                  type: array
                  description: 'Must be a valid UUID. The <code>id</code> of an existing record in the roles table.'
                  example:
                    - 1937113a-b0a2-3b03-925a-3163292463db
                  items:
                    type: string
                donor_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: b9567dd8-446c-3a6f-8f1a-54673f212a38
                  nullable: true
                donor_scope:
                  type: string
                  description: ''
                  example: todas
                  enum:
                    - todas
                    - zonas
                    - sucursales
                  nullable: true
                donor_branch_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 46779b45-df80-30c6-ad3c-320d08b0f185
                  nullable: true
                organization_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: b1acb002-2839-312b-9bbc-3ecc71af48bf
                  nullable: true
                branch_ids:
                  type: array
                  description: 'Must be a valid UUID.'
                  example:
                    - 5f936efd-e185-3891-a84d-e9ea08ed9d45
                  items:
                    type: string
                zone_ids:
                  type: array
                  description: 'Must be a valid UUID.'
                  example:
                    - 0e2442a9-fa81-3115-8890-8b00ec9cd683
                  items:
                    type: string
    delete:
      summary: 'Eliminar usuario'
      operationId: eliminarUsuario
      description: 'Elimina un usuario (soft delete) y revoca sus tokens.'
      parameters: []
      responses: {  }
      tags:
        - Usuarios
    parameters:
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: 00000000-0000-0000-0000-000000000011
        required: true
        schema:
          type: string
      -
        in: path
        name: user
        description: 'ID del usuario.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/users/{user_id}/toggle-active':
    put:
      summary: 'Activar/desactivar usuario'
      operationId: activardesactivarUsuario
      description: 'Alterna el estado activo del usuario. Si se desactiva, revoca sus tokens.'
      parameters: []
      responses: {  }
      tags:
        - Usuarios
    parameters:
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: 00000000-0000-0000-0000-000000000011
        required: true
        schema:
          type: string
      -
        in: path
        name: user
        description: 'ID del usuario.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/users/{user_id}/reset-password':
    put:
      summary: 'Restablecer contraseña'
      operationId: restablecerContrasea
      description: 'Restablece la contraseña de un usuario y revoca sus tokens.'
      parameters: []
      responses: {  }
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: bngzmiyvdljnikhwaykcmyuwpw
              required:
                - new_password
    parameters:
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: 00000000-0000-0000-0000-000000000011
        required: true
        schema:
          type: string
      -
        in: path
        name: user
        description: 'ID del usuario.'
        example: 1
        required: true
        schema:
          type: integer
  /api/roles:
    get:
      summary: 'Listar roles'
      operationId: listarRoles
      description: 'Retorna lista de roles del tenant, paginada o completa.'
      parameters:
        -
          in: query
          name: search
          description: 'Buscar por nombre de rol.'
          example: admin
          required: false
          schema:
            type: string
            description: 'Buscar por nombre de rol.'
            example: admin
        -
          in: query
          name: all
          description: 'Retornar todos sin paginar.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Retornar todos sin paginar.'
            example: true
        -
          in: query
          name: per_page
          description: 'Resultados por página.'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Resultados por página.'
            example: 25
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'No autenticado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No autenticado'
      tags:
        - 'Roles y Permisos'
    post:
      summary: 'Crear rol'
      operationId: crearRol
      description: 'Crea un nuevo rol con permisos asignados.'
      parameters: []
      responses: {  }
      tags:
        - 'Roles y Permisos'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nombre del rol.'
                  example: Coordinador
                description:
                  type: string
                  description: Descripción.
                  example: null
                  nullable: true
                permissions:
                  type: array
                  description: 'Permisos asignados al rol.'
                  example:
                    - distributions.create
                    - mermas.view
                  items:
                    type: string
              required:
                - name
  '/api/roles/{role_id}':
    get:
      summary: 'Ver rol'
      operationId: verRol
      description: 'Retorna un rol con sus permisos y cantidad de usuarios asignados.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'No autenticado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No autenticado'
      tags:
        - 'Roles y Permisos'
    put:
      summary: 'Actualizar rol'
      operationId: actualizarRol
      description: 'Actualiza nombre, descripción y permisos del rol. No permite modificar roles de sistema.'
      parameters: []
      responses: {  }
      tags:
        - 'Roles y Permisos'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                description:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: 'Et animi quos velit et fugiat.'
                  nullable: true
                permissions:
                  type: array
                  description: 'Must be a valid UUID. The <code>id</code> of an existing record in the permissions table.'
                  example:
                    - 5707ca55-f609-3528-be8b-1baeaee1567e
                  items:
                    type: string
    delete:
      summary: 'Eliminar rol'
      operationId: eliminarRol
      description: 'Elimina un rol (soft delete). No permite eliminar roles de sistema o con usuarios asignados.'
      parameters: []
      responses: {  }
      tags:
        - 'Roles y Permisos'
    parameters:
      -
        in: path
        name: role_id
        description: 'The ID of the role.'
        example: 00000000-0000-0000-0000-000000000010
        required: true
        schema:
          type: string
      -
        in: path
        name: role
        description: 'ID del rol.'
        example: 1
        required: true
        schema:
          type: integer
  /api/permissions:
    get:
      summary: 'Listar permisos disponibles'
      operationId: listarPermisosDisponibles
      description: ''
      parameters:
        -
          in: query
          name: module
          description: 'Filtrar por módulo.'
          example: mermas
          required: false
          schema:
            type: string
            description: 'Filtrar por módulo.'
            example: mermas
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'No autenticado'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No autenticado'
      tags:
        - 'Roles y Permisos'
  /api/donors:
    get:
      summary: 'Listar donantes'
      operationId: listarDonantes
      description: 'Retorna lista paginada de donantes del tenant.'
      parameters:
        -
          in: query
          name: search
          description: 'Buscar por nombre, razón social o CUIT del donante, o por nombre/código/contacto de sus sucursales (la respuesta incluye `matched_via` cuando el match fue por sucursal o contacto).'
          example: Carrefour
          required: false
          schema:
            type: string
            description: 'Buscar por nombre, razón social o CUIT del donante, o por nombre/código/contacto de sus sucursales (la respuesta incluye `matched_via` cuando el match fue por sucursal o contacto).'
            example: Carrefour
        -
          in: query
          name: parent_only
          description: 'Solo donantes padre (sin parent_donor_id).'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Solo donantes padre (sin parent_donor_id).'
            example: true
        -
          in: query
          name: parent_id
          description: 'Hijos de un donante padre (UUID).'
