  '/api/distributions/{distribution_id}/prepare':
    put:
      summary: 'Preparar: deja el pedido listo para retiro en un solo acto.'
      operationId: prepararDejaElPedidoListoParaRetiroEnUnSoloActo
      description: "Ficha #3095. Paula (reunión 03/09), cuando Tomás le preguntó en cuántos\npasos le gustaría: \"2. Si yo armaría el pedido... ¿y lo aprobamos o no lo\naprobamos?\". De los cinco pasos actuales, \"en revisión\" y \"en\npreparación\" no hacen NADA más que registrar quién apretó el botón, y\n\"programar\" vuelve a pedir la fecha y el horario que ya se cargaron al\ncrear el pedido.\n\nRecorre la cadena completa (en_revision → aprobada → programada →\nen_preparacion → lista_para_retiro) transición por transición, así el\nhistorial sigue registrando cada cambio con su autor: se juntan los\nclics, no se pierde la trazabilidad que planteó Tomás.\n\nAprueba las cantidades tal como se pidieron. Para entregar menos que lo\npedido (no alcanza el stock) sigue estando approve() con su ventana de\ncantidades."
      parameters: []
      responses: {  }
      tags:
        - Distribuciones
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                preparation_notes:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: b
                  nullable: true
    parameters:
      -
        in: path
        name: distribution_id
        description: 'The ID of the distribution.'
        example: 1aee7301-05a2-4cac-92ad-5a77a1fe261f
        required: true
        schema:
          type: string
