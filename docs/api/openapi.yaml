    put:
      summary: 'PUT /programs/{program}/enrollments/{enrollment}/monthly-quotas'
      operationId: pUTprogramsprogramenrollmentsenrollmentmonthlyQuotas
      description: "Bulk upsert. Body: { months: [{year_month: 'YYYY-MM', modules_quota: int, notes?}, ...] }\nCada mes en el body se inserta o actualiza. Meses no incluidos no se tocan.\nSi modules_quota == 0 y hay una fila existente, se conserva en 0 (no se borra)."
      parameters: []
      responses: {  }
      tags:
        - Programas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                months:
                  type: array
                  description: 'Must have at least 1 items. Must not have more than 120 items.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      year_month:
                        type: string
                        description: 'Must match the regex /^\d{4}-(0[1-9].'
                        example: 6425-(03
                      modules_quota:
                        type: integer
                        description: 'Must be at least 0. Must not be greater than 100000.'
                        example: 1
                      notes:
                        type: string
                        description: 'Must not be greater than 500 characters.'
                        example: l
                        nullable: true
                    required:
                      - year_month
                      - modules_quota
              required:
                - months
