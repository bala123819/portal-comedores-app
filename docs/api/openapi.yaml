  /api/donor-intake/test:
    post:
      summary: 'Lanza una recepción de PRUEBA, idéntica en forma a la que manda la cadena.'
      operationId: lanzaUnaRecepcinDePRUEBAIdnticaEnFormaALaQueMandaLaCadena
      description: "## Por qué existe\n\nProbar el ciclo de una merma exigía armar el JSON a mano y pegarle al endpoint externo con\nuna API key — algo que sólo se puede hacer desde una consola, y que en la práctica hacía que\ncada prueba dependiera de alguien con acceso al servidor.\n\n## Por qué NO reusa el endpoint externo\n\n`/api/external/donor-intake` está detrás del middleware `api_key`: es la puerta de la cadena\ny sigue siéndolo. Meterle una segunda forma de autenticación, o poner una key en el navegador,\nsería abrirla. Este endpoint entra por el JWT del panel y termina en el MISMO lugar.\n\n## Qué comparte con el camino real, a propósito\n\nLa fila se crea con `DonorIncomingRequest::createFromRequest`, igual que la entrada real: el\nchecksum, los identificadores de donante y sucursal y el conteo de items salen de ahí y no de\nuna copia. Si mañana cambia cómo se interpreta un payload, las dos entradas cambian juntas.\n\n## En qué se diferencia\n\n1. Lleva `_prueba: true` en el payload, para poder distinguirla del histórico real del cliente.\n2. Se procesa en el acto en vez de esperar al cron (`donor-intake:process`, cada 5 min).\n\nLa merma que sale es REAL: entra al tablero, dispara los webhooks y despierta a los agentes\ncomo cualquier otra. La marca dice de dónde vino, no la vuelve inofensiva."
      parameters: []
      responses: {  }
      tags:
        - 'External - Ingesta de Donantes'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_code:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: b
                pickup_date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-09-24'
                  nullable: true
                pickup_time_start:
                  type: string
                  description: 'Must match the regex /^\d{2}:\d{2}$/.'
                  example: '64:25'
                  nullable: true
                pickup_time_end:
                  type: string
                  description: 'Must match the regex /^\d{2}:\d{2}$/.'
                  example: '64:25'
                  nullable: true
                perecederos:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
                productos:
                  type: array
                  description: 'Must have at least 1 items.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      descripcion:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: b
                      cantidad:
                        type: number
                        description: 'Must be at least 0.01.'
                        example: 39
                    required:
                      - descripcion
                      - cantidad
              required:
                - branch_code
                - productos
