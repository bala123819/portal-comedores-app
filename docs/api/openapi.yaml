  -
    name: 'Billing - SMVM'
    description: "\nSalario Mínimo Vital y Móvil — tabla nacional sin tenant."
  -
    name: Compras
    description: ''
  -
    name: Donaciones
    description: ''
  -
    name: 'External - Ingesta de Donantes'
    description: ''
  -
    name: Familias
