openapi: 3.0.3
info:
  title: 'Mermab API - Banco de Alimentos'
  description: 'API para la gestión de bancos de alimentos. Maneja inventario, distribuciones, mermas, organizaciones, donantes y más.'
  version: 4.0.0
servers:
  -
    url: 'https://cloud.mermab.com'
tags:
  -
    name: Autenticación
    description: "\nEndpoints para autenticación y gestión de sesión."
  -
    name: Usuarios
    description: "\nGestión de usuarios del tenant."
  -
    name: 'Roles y Permisos'
    description: "\nGestión de roles y sus permisos asociados."
  -
    name: Donantes
    description: "\nGestión de donantes y sus estadísticas."
  -
    name: 'Sucursales de Donantes'
    description: "\nGestión de sucursales asociadas a donantes."
  -
    name: Organizaciones
    description: "\nGestión de organizaciones (comedores, instituciones)."
  -
    name: 'Categorías de Alimentos'
    description: "\nGestión de categorías para clasificar productos alimenticios."
  -
    name: 'Grupos Nutricionales'
    description: "\nGestión de grupos nutricionales para clasificación de productos."
