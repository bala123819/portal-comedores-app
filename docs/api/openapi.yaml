    description: ''
  -
    name: 'Zonas Geográficas'
    description: ''
  -
    name: Archivos
    description: ''
  -
    name: Reportes
    description: ''
  -
    name: 'Reportes de Mermas'
    description: ''
  -
    name: 'Estadísticas de Operaciones'
    description: ''
  -
    name: 'Analytics de Donantes'
    description: ''
  -
    name: Notificaciones
    description: ''
  -
    name: 'Portal Sucursal'
    description: ''
  -
    name: 'Portal Organización'
    description: ''
  -
    name: 'API Keys'
    description: "\nGestión de API keys para integraciones máquina-a-máquina (M2M).\nSolo accesible por administradores."
  -
    name: Sistema
    description: ''
  -
    name: 'Billing - Configuration'
    description: ''
  -
